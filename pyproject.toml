[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-bounty-data"
version = "0.1.0"
description = "Find scoped paid tasks with clear acceptance and authorization."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-bounty-data = "book_bounty_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_bounty_data = ["*.json"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
# cli.py is the shared CLI vendored (copied) across the sibling book-*-data repos; keep it
# byte-for-byte comparable with its siblings and reformat it only together with them.
exclude = ["src/*/cli.py"]

[tool.ruff.lint]
# Same correctness-focused set as the sibling book-*-data repos; the compact adapter style
# (E7 one-line statements) is intentionally left alone.
select = ["E9", "F", "I", "UP", "B"]
