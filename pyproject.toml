[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-bounty-data"
version = "0.1.0"
description = "Find scoped paid tasks with clear acceptance and authorization."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-bounty-data = "book_bounty_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_bounty_data = ["*.json"]
